apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitor
  namespace: argocd
spec:
  destination:
    namespace: monitor
    server: https://kubernetes.default.svc
  project: monitor
  source:
    path: charts/monitor
    repoURL: https://github.com/ayururutia/xcharts.git
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
        - values-xx.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true